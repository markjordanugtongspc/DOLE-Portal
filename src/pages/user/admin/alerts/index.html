<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/dole-logo.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alerts - DOLE Portal</title>
  <script>
    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    (function () {
      var raw = localStorage.getItem('dole_session');
      if (!raw) { window.location.replace('/?auth=login_required'); return; }
      try {
        var roleId = Number(JSON.parse(raw).role_id);
        if (roleId !== 1 && roleId !== 2) window.location.replace('/src/pages/user/staff/dashboard/');
      } catch (error) { localStorage.removeItem('dole_session'); window.location.replace('/?auth=login_required'); }
    })();
  </script>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300 dark:bg-gray-950 dark:text-white">
  <div id="sidebar" data-role="alerts" data-active="alerts"></div>
  <div class="min-h-screen sm:ml-64">
    <main id="alerts-page" class="mx-auto w-full max-w-5xl space-y-6 p-4 sm:p-6 md:p-8">
      <div class="flex flex-col gap-4 border-b border-gray-300 pb-4 dark:border-gray-700 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h1 class="text-2xl font-extrabold text-gray-900 dark:text-white">Alerts</h1>
          <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Review registration requests and portal activity.</p>
        </div>
        <select id="alerts-filter" class="w-full cursor-pointer border border-gray-300 bg-white px-3 py-2 text-sm font-semibold text-gray-700 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-200 dark:focus:ring-blue-900 sm:w-48">
          <option value="all">All notifications</option>
          <option value="unread">Unread</option>
        </select>
      </div>
      <section class="overflow-hidden border border-gray-200 bg-gray-50 shadow-sm dark:border-gray-800 dark:bg-gray-900">
        <div class="flex flex-col gap-3 border-b border-gray-200 bg-white p-3 dark:border-gray-800 dark:bg-gray-900 sm:flex-row sm:items-center sm:justify-between">
          <label class="inline-flex cursor-pointer items-center gap-2 text-sm font-bold text-gray-700 dark:text-gray-200"><input id="alerts-select-all" type="checkbox" class="h-4 w-4 rounded border-gray-300 text-blue-600 focus:ring-blue-500 dark:border-gray-700 dark:bg-gray-800"> Select all</label>
          <div class="grid grid-cols-2 gap-2 sm:flex">
            <button id="alerts-mark-read" type="button" disabled class="cursor-pointer border border-blue-200 bg-blue-50 px-3 py-2 text-xs font-bold text-blue-700 transition-colors hover:bg-blue-100 disabled:opacity-50 dark:border-blue-900/60 dark:bg-blue-950/30 dark:text-blue-300 dark:hover:bg-blue-950/60">Mark as read</button>
            <button id="alerts-delete" type="button" disabled class="cursor-pointer bg-red-600 px-3 py-2 text-xs font-bold text-white transition-colors hover:bg-red-700 disabled:opacity-50">Delete notification</button>
          </div>
        </div>
        <p id="alerts-error" class="hidden m-4 border border-red-200 bg-red-50 p-3 text-sm font-medium text-red-700 dark:border-red-900/60 dark:bg-red-950/30 dark:text-red-300"></p>
        <div id="alerts-list" class="space-y-3 p-3 sm:p-4"></div>
        <div id="alerts-empty" class="hidden p-10 text-center text-sm font-semibold text-gray-500 dark:text-gray-400">No notifications in this view.</div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
